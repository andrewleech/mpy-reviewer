# Deployment:
#   1. Copy bot/config/bot.example.toml to bot/config/bot.toml and fill in secrets
#   2. Place the GitHub App private key at bot/config/bot-private-key.pem
#   3. Copy Claude OAuth credentials: ./bot/config/refresh-credentials.sh
#      (copies ~/.claude.json and ~/.claude/.credentials.json into bot/config/claude-oauth/)
#   4. Run: docker compose -f bot/docker-compose.yml up -d
#   5. Point GitHub webhook URL to https://<host>:${WEBHOOK_PORT:-8080}/webhook
#
# Credential refresh (no restart needed):
#   ./bot/config/refresh-credentials.sh
#   New credentials take effect on the next claude -p invocation.

services:
  mcp-server:
    build:
      context: ..
      dockerfile: bot/Dockerfile
    command: ["python", "mcp_server.py", "--transport", "sse", "--port", "9090"]
    volumes:
      - mpy-checkout:/workspace/micropython
      - token-share:/var/run/token
      - hf-cache:/home/botuser/.cache/huggingface
    environment:
      - GITHUB_TOKEN_FILE=/var/run/token/github_token
      - MPY_CHECKOUT=/workspace/micropython
      - MPY_REVIEWER_BOT_MODE=1
      - BOT_TARGET_REPO=${BOT_TARGET_REPO:-micropython/micropython}
    healthcheck:
      test: ["CMD", "python", "-c",
             "import socket; s=socket.create_connection(('localhost',9090),2); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [bot-internal]
    restart: unless-stopped

  webhook:
    build:
      context: ..
      dockerfile: bot/Dockerfile
    command: ["python", "-m", "bot.webhook_service"]
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # TODO: re-enable when Docker supports it — isolates /proc so
    # system prompt in claude -p args isn't visible to other containers.
    # pid: private
    ports:
      - "${WEBHOOK_PORT:-8080}:8080"
    volumes:
      - ./config/bot.toml:/config/bot.toml:ro
      - ./config/bot-private-key.pem:/config/bot-private-key.pem:ro
      - ./config/claude-oauth/:/config/claude-oauth/
      - mpy-checkout:/workspace/micropython
      - token-share:/var/run/token
    environment:
      - BOT_CONFIG_PATH=/config/bot.toml
      - GITHUB_TOKEN_FILE=/var/run/token/github_token
      - MPY_CHECKOUT=/workspace/micropython
    depends_on:
      mcp-server:
        condition: service_healthy
    networks: [bot-internal]
    restart: unless-stopped

networks:
  bot-internal:
    # MCP server port 9090 is only accessible within this network.
    # It is NOT published externally. The webhook service is the only
    # client. Do not add 'ports:' to the mcp-server service.
    #
    # Design decision: no application-level auth on MCP endpoint.
    # Docker network isolation is the sole access control mechanism.

volumes:
  mpy-checkout:
  hf-cache:
  token-share:
    driver_opts:
      type: tmpfs
      device: tmpfs
