[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mpy-reviewer"
version = "0.1.0"
description = "MicroPython Review RAG - code review assistant"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "MicroPython Review Tools"}
]

dependencies = [
    "sqlite-vec>=0.1.6",
    "sentence-transformers>=2.2.0",
    "einops>=0.7.0",
    "click>=8.0.0",
    "tqdm>=4.65.0",
    "numpy>=1.24.0",
    "fastmcp>=2.0,<3",
]

[project.optional-dependencies]
bot = [
    "PyJWT>=2.0",
    "cryptography",
    "starlette>=0.27",
    "uvicorn>=0.20",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21",
    "pytest-cov",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "bot/tests"]

[project.scripts]
mpy-reviewer = "rag.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rag*", "bot*"]

[tool.uv]
index-url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
